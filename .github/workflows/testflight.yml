name: TestFlight
on:
  workflow_run:
    workflows: [iOS]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: read
  actions: read
  deployments: write
# Mutex only; main history + deployment records are the durable queue.
# Coalesced pending runs cannot drop queued commits.
concurrency:
  group: rallyroo-testflight-queue
  cancel-in-progress: false
jobs:
  plan:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.queue.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Find oldest unpublished iOS commit
        id: queue
        env:
          GH_TOKEN: ${{ github.token }}
          TESTFLIGHT_START_SHA: ${{ vars.TESTFLIGHT_START_SHA }}
        run: python3 scripts/testflight-queue.py --plan
  upload:
    needs: plan
    if: needs.plan.outputs.sha != ''
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Select pinned Xcode 26.3
        run: |
          test -d /Applications/Xcode_26.3.app || {
            echo "Pinned Xcode 26.3 is unavailable" >&2
            exit 1
          }
          sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          ruby-version: '3.3.8'
      - name: Install pinned upload tooling
        run: gem install fastlane -v 2.232.2 --no-document --user-install
      - name: Sign and deliver queued commit
        env:
          GH_TOKEN: ${{ github.token }}
          TESTFLIGHT_START_SHA: ${{ vars.TESTFLIGHT_START_SHA }}
          QUEUED_SHA: ${{ needs.plan.outputs.sha }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          ASC_API_PRIVATE_KEY: ${{ secrets.ASC_API_PRIVATE_KEY }}
          APPLE_DISTRIBUTION_CERT: ${{ secrets.APPLE_DISTRIBUTION_CERT }}
          APPLE_DISTRIBUTION_CERT_PWD: ${{ secrets.APPLE_DISTRIBUTION_CERT_PWD }}
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
          APPLE_SHARE_EXTENSION_PROVISIONING_PROFILE: ${{ secrets.APPLE_SHARE_EXTENSION_PROVISIONING_PROFILE }}
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          FASTLANE_HIDE_CHANGELOG: '1'
        run: python3 scripts/testflight-queue.py
