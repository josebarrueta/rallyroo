name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version to publish (for example, 1.2.3 or 1.2.3-rc.1)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: josebarrueta/rallyroo-api
  CHART_REGISTRY: oci://ghcr.io/josebarrueta/charts

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
      stable: ${{ steps.version.outputs.stable }}
    steps:
      - name: Resolve release version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            raw_version="$REQUESTED_VERSION"
          else
            raw_version="$GITHUB_REF_NAME"
          fi
          version="${raw_version#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Version must be SemVer without build metadata: $raw_version" >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" && "$raw_version" != "v$version" ]]; then
            echo "Release tags must start with v" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "stable=false" >> "$GITHUB_OUTPUT"
          else
            echo "stable=true" >> "$GITHUB_OUTPUT"
          fi

  verify:
    needs: prepare
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rallyroo
          POSTGRES_PASSWORD: rallyroo
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rallyroo -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      INTEGRATION_DATABASE_URL: postgres://rallyroo:rallyroo@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v5
      - run: ./deploy/helm/rallyroo/test-chart-contract.sh
      - run: ./deploy/flux/rallyroo/test-flux-contract.sh
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/api/package-lock.json
      - name: Verify API
        working-directory: server/api
        run: |
          run_timed() {
            label="$1"
            shift
            started=$SECONDS
            "$@"
            echo "::notice title=Release timing::$label completed in $((SECONDS - started))s"
          }
          run_timed "npm ci" npm ci --no-audit --no-fund
          run_timed "unit tests" npm run test:unit
          run_timed "migration tests" npm run test:migrations
          run_timed "typecheck" npm run typecheck
          run_timed "TypeScript build" npm run build

  # Native image builds may run alongside verification. Only immutable
  # build-candidate tags are pushed here; publish remains verification-gated.
  build-image:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            suffix: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Start image build timer
        run: date +%s > /tmp/rallyroo-image-build-started
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build native ${{ matrix.platform }} image
        uses: docker/build-push-action@v7
        with:
          context: server/api
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:build-${{ needs.prepare.outputs.sha }}-${{ matrix.suffix }}
          labels: |
            org.opencontainers.image.title=Rallyroo API
            org.opencontainers.image.description=Rallyroo family scheduler API
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=release-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.suffix }}
      - name: Report image build timing
        if: always()
        run: |
          started=$(cat /tmp/rallyroo-image-build-started)
          echo "::notice title=Release timing::${{ matrix.platform }} image job completed in $(($(date +%s) - started))s"

  publish:
    needs: [prepare, verify, build-image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-architecture image manifest
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA_VERSION: ${{ needs.prepare.outputs.sha }}
          STABLE: ${{ needs.prepare.outputs.stable }}
        run: |
          started=$SECONDS
          image="$REGISTRY/$IMAGE_NAME"
          tags=(--tag "$image:$VERSION" --tag "$image:sha-$SHA_VERSION")
          if [[ "$STABLE" == "true" ]]; then
            tags+=(--tag "$image:latest")
          fi
          docker buildx imagetools create "${tags[@]}" \
            "$image:build-$SHA_VERSION-amd64" \
            "$image:build-$SHA_VERSION-arm64"
          docker buildx imagetools inspect "$image:$VERSION"
          echo "::notice title=Release timing::Image manifest published in $((SECONDS - started))s"

      - uses: azure/setup-helm@v5
      - name: Package Helm chart
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          started=$SECONDS
          mkdir -p dist
          helm package deploy/helm/rallyroo \
            --destination dist \
            --version "$VERSION" \
            --app-version "$VERSION"
          helm show chart "dist/rallyroo-$VERSION.tgz"
          echo "::notice title=Release timing::Helm chart packaged in $((SECONDS - started))s"

      # The chart is the deployment promotion signal and is deliberately
      # published only after every image architecture is available.
      - name: Publish Helm chart last
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          started=$SECONDS
          echo "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push "dist/rallyroo-$VERSION.tgz" "$CHART_REGISTRY"
          echo "::notice title=Release timing::Helm chart published last in $((SECONDS - started))s"

      - uses: actions/upload-artifact@v6
        with:
          name: rallyroo-helm-${{ needs.prepare.outputs.version }}
          path: dist/rallyroo-${{ needs.prepare.outputs.version }}.tgz
          if-no-files-found: error

  create-release:
    needs: [prepare, verify, build-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Create GitHub Release with changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          VERSION_NUM="v${VERSION}"
          PREV_TAG=$(git tag --list 'v*' --sort=-version:version \
                    | grep -v "^${VERSION_NUM}$" | head -1)
          echo "Previous release: ${PREV_TAG:-first}"
          RANGE=""
          if [ -n "${PREV_TAG}" ]; then
           RANGE="${PREV_TAG}..${GITHUB_SHA}"
          fi

           { 
            echo "## Rallyroo v${VERSION}"
            echo ""
            echo "### Server / API"
            echo ""
            if [ -n "${RANGE}" ];
            then
              git log ${RANGE} --reverse --format='- %s' -- server/ deploy/ .github/ docs/
            else
             echo "(initial release)"
            fi
            echo ""
            echo "### iOS / UI"
            echo ""
            if [ -n "${RANGE}" ];
            then
              git log ${RANGE} --reverse --format='- %s' -- clients/ios/
            else
             echo "(initial release)"
            fi
           } > /tmp/release-body.md

          cat /tmp/release-body.md

          PRE_RELEASE=""
          if [[ "${VERSION}" == *-* ]]; then
           PRE_RELEASE="--prerelease"
          fi

          gh release create ${VERSION_NUM} \
             --title "Rallyroo v${VERSION}" \
             --notes-file /tmp/release-body.md \
             ${PRE_RELEASE} \
             --latest false
