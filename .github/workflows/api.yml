name: API

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "server/api/**"
      - "deploy/**"
      - ".github/workflows/api.yml"
      - ".github/workflows/release.yml"
  push:
    branches: [main]
    paths:
      - "server/api/**"
      - "deploy/**"
      - ".github/workflows/api.yml"
      - ".github/workflows/release.yml"

jobs:
  chart:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v5
      - run: ./deploy/helm/rallyroo/test-chart-contract.sh
      - run: ./deploy/flux/rallyroo/test-flux-contract.sh
      - run: ./deploy/gcp/test-backup-job.sh

  quality:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server/api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/api/package-lock.json
      - run: npm ci
      - run: npm run test:unit
      - run: npm run typecheck
      - run: npm run build

  integration:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rallyroo
          POSTGRES_PASSWORD: rallyroo
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rallyroo -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8.10.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      INTEGRATION_DATABASE_URL: postgres://rallyroo:rallyroo@localhost:5432/postgres
      INTEGRATION_REDIS_URL: redis://localhost:6379
    defaults:
      run:
        working-directory: server/api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/api/package-lock.json
      - run: npm ci
      - run: npm run test:migrations
      - run: npm run test:integration
