server {
  listen 8080 default_server;
  server_name api.rallyroo.dev _;
  server_tokens off;
  client_max_body_size 1m;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;

  error_page 404 /__rallyroo_not_found;

  location = /_nginx-health {
    access_log off;
    return 204;
  }

  location ~ ^/(?:v1(?:/|$)|health$|ready$|metrics$) {
    proxy_pass http://{{ .Release.Name }}-api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
  }

  {{- if .Values.calendarPreview.enabled }}
  # This listener is reachable externally only through the trusted Cloudflare
  # tunnel. Cloudflare overwrites X-Forwarded-Proto; never challenge over HTTP.
  location ~ ^/(?:dav(?:/|$)|\.well-known/caldav$) {
    access_log off;
    error_log /dev/null;
    if ($http_x_forwarded_proto != "https") { return 403; }
    proxy_pass http://{{ .Release.Name }}-api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
  }
  {{- end }}

  location = /__rallyroo_not_found {
    internal;
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    return 404 '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>404 — Rallyroo</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#fff7e8;color:#29233a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{width:min(100%,560px);padding:48px 36px;text-align:center;background:#fff;border:2px solid #704fb5;border-radius:28px;box-shadow:10px 10px 0 #54bdb3}.badge{display:inline-block;padding:8px 16px;border-radius:999px;background:#ffba47;color:#29233a;font-size:14px;font-weight:800;letter-spacing:.12em}.mark{margin:24px auto 16px;width:72px;height:72px;display:grid;place-items:center;border-radius:22px;background:#f55961;color:#fff;font-size:34px;font-weight:900;transform:rotate(-4deg)}h1{margin:0;color:#704fb5;font-size:clamp(2rem,8vw,3.4rem);line-height:1.05}p{margin:18px auto 0;max-width:390px;color:#5e586b;font-size:1.05rem;line-height:1.6}.brand{margin-top:30px;font-weight:800;color:#29233a}.tagline{margin-top:4px;color:#704fb5;font-size:.9rem;font-weight:700}@media(max-width:480px){.card{padding:38px 24px;box-shadow:7px 7px 0 #54bdb3}}</style></head><body><main class="card"><div class="badge">404 · OFF SCHEDULE</div><div class="mark">R</div><h1>Nothing scheduled here.</h1><p>This API endpoint does not exist. Check the address and try again.</p><div class="brand">Rallyroo</div><div class="tagline">Rally your crew.</div></main></body></html>';
  }

  location / {
    return 404;
  }
}
