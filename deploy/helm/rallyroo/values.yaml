api:
  image:
    repository: ghcr.io/josebarrueta/rallyroo-api
    # Defaults to the packaged chart's appVersion when empty.
    tag: ""
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      memory: 512Mi

runtimeSecret: rallyroo-runtime

providerSecrets:
  stytch: ""
  calendarEncryption: ""
  googlePlaces: ""
  resendInvitations: ""
  apns: ""
  observability: ""

runtimeConfig:
  # Production enables this through Flux. Local development continues reading
  # provider configuration from server/api/.env through the runtime Secret.
  enabled: false
  logLevel: info
  stytch:
    projectID: ""
    publicToken: ""
    oauthCallbackURL: rallyroo://oauth-callback
    environment: test
    customBaseURL: ""
  invitationEmail:
    from: ""
  ollama:
    baseURL: ""
    model: qwen3.8:27b-mlx
  apns:
    teamID: ""
    bundleID: dev.rallyroo.app
    environment: sandbox

migrations:
  # The init container handles first install because PostgreSQL is created by
  # this chart. This hook gates later upgrades before workloads are changed.
  preUpgrade:
    enabled: true
    backoffLimit: 1
    activeDeadlineSeconds: 300
  # Optional compatible work that must wait until the new release is healthy.
  # Destructive changes do not belong here because Flux may still roll back.
  postUpgrade:
    enabled: false
    backoffLimit: 1
    activeDeadlineSeconds: 300
    rolloutWaitImage: registry.k8s.io/kubectl:v1.36.1

tests:
  image: busybox:1.37.0

postgres:
  image: postgres:17-alpine
  # Empty preserves local .env-based development. Production points this to
  # the narrowly scoped Secret synchronized by the 1Password Operator.
  credentialsSecret: ""
  database: rallyroo
  user: rallyroo
  persistence:
    mode: pvc
    size: 5Gi
    storageClass: ""
    hostPath: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

redis:
  image: redis:8.10.1-alpine
  persistence:
    mode: pvc
    size: 2Gi
    storageClass: ""
    hostPath: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

nginx:
  image: nginxinc/nginx-unprivileged:1.29-alpine
  service:
    type: ClusterIP
    nodePort: null
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 128Mi
