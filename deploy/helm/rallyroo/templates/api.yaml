apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
  labels:
    {{- include "rallyroo.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "rallyroo.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels:
    {{- include "rallyroo.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "rallyroo.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "rallyroo.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
      {{- if .Values.runtimeConfig.enabled }}
      annotations:
        checksum/runtime-config: {{ include (print $.Template.BasePath "/runtime-config.yaml") . | sha256sum }}
      {{- end }}
    spec:
      {{- if or .Values.postgres.credentialsSecret .Values.providerSecrets.stytch .Values.providerSecrets.calendarEncryption .Values.providerSecrets.familyDataEncryption .Values.providerSecrets.googlePlaces .Values.providerSecrets.resendInvitations .Values.providerSecrets.apns .Values.providerSecrets.observability }}
      securityContext:
        fsGroup: 1000
      {{- end }}
      initContainers:
        - name: migrate
          image: "{{ .Values.api.image.repository }}:{{ include "rallyroo.apiImageTag" . }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          command: ["/app/scripts/migrate.sh"]
          args: ["pre"]
          {{- if not .Values.postgres.credentialsSecret }}
          envFrom:
            - secretRef:
                name: {{ .Values.runtimeSecret }}
          {{- end }}
          env:
            - name: APPLICATION_VERSION
              value: {{ include "rallyroo.apiImageTag" . | quote }}
            {{- if .Values.postgres.credentialsSecret }}
            {{- include "rallyroo.postgresConnectionEnv" . | nindent 12 }}
          volumeMounts:
            {{- include "rallyroo.postgresPasswordVolumeMount" . | nindent 12 }}
            {{- else }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.runtimeSecret }}
                  key: DATABASE_URL
            {{- end }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ include "rallyroo.apiImageTag" . }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          envFrom:
            {{- if not .Values.runtimeConfig.enabled }}
            - secretRef:
                name: {{ .Values.runtimeSecret }}
            {{- else }}
            - configMapRef:
                name: {{ .Release.Name }}-runtime-config
            {{- end }}
          env:
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "3000"
            {{- if .Values.postgres.credentialsSecret }}
            {{- include "rallyroo.postgresConnectionEnv" . | nindent 12 }}
            {{- else }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.runtimeSecret }}
                  key: DATABASE_URL
            {{- end }}
            - name: REDIS_URL
              value: redis://{{ .Release.Name }}-redis:6379
            {{- if .Values.providerSecrets.stytch }}
            - name: STYTCH_SECRET_FILE
              value: /run/secrets/stytch/secret
            {{- end }}
            {{- if .Values.providerSecrets.calendarEncryption }}
            - name: CALENDAR_SOURCE_ENCRYPTION_KEY_FILE
              value: /run/secrets/calendar-encryption/key
            {{- end }}
            {{- if .Values.providerSecrets.familyDataEncryption }}
            - name: FAMILY_DATA_ENCRYPTION_KEY_FILE
              value: /run/secrets/family-data-encryption/key
            {{- end }}
            {{- if .Values.providerSecrets.googlePlaces }}
            - name: GOOGLE_PLACES_API_KEY_FILE
              value: /run/secrets/google-places/api-key
            {{- end }}
            {{- if .Values.providerSecrets.resendInvitations }}
            - name: RESEND_API_KEY_FILE
              value: /run/secrets/resend-invitations/api-key
            {{- end }}
            {{- if .Values.providerSecrets.apns }}
            - name: APNS_KEY_ID_FILE
              value: /run/secrets/apns/key-id
            - name: APNS_PRIVATE_KEY_FILE
              value: /run/secrets/apns/private-key
            {{- end }}
            {{- if .Values.providerSecrets.observability }}
            - name: METRICS_BEARER_TOKEN_FILE
              value: /run/secrets/observability/metrics-token
            {{- end }}
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          {{- if or .Values.postgres.credentialsSecret .Values.providerSecrets.stytch .Values.providerSecrets.calendarEncryption .Values.providerSecrets.familyDataEncryption .Values.providerSecrets.googlePlaces .Values.providerSecrets.resendInvitations .Values.providerSecrets.apns .Values.providerSecrets.observability }}
          volumeMounts:
            {{- if .Values.postgres.credentialsSecret }}
            {{- include "rallyroo.postgresPasswordVolumeMount" . | nindent 12 }}
            {{- end }}
            {{- if .Values.providerSecrets.stytch }}
            - name: stytch-credentials
              mountPath: /run/secrets/stytch
              readOnly: true
            {{- end }}
            {{- if .Values.providerSecrets.calendarEncryption }}
            - name: calendar-encryption
              mountPath: /run/secrets/calendar-encryption
              readOnly: true
            {{- end }}
            {{- if .Values.providerSecrets.familyDataEncryption }}
            - name: family-data-encryption
              mountPath: /run/secrets/family-data-encryption
              readOnly: true
            {{- end }}
            {{- if .Values.providerSecrets.googlePlaces }}
            - name: google-places-credentials
              mountPath: /run/secrets/google-places
              readOnly: true
            {{- end }}
            {{- if .Values.providerSecrets.resendInvitations }}
            - name: resend-invitation-credentials
              mountPath: /run/secrets/resend-invitations
              readOnly: true
            {{- end }}
            {{- if .Values.providerSecrets.apns }}
            - name: apns-credentials
              mountPath: /run/secrets/apns
              readOnly: true
            {{- end }}
            {{- if .Values.providerSecrets.observability }}
            - name: observability-credentials
              mountPath: /run/secrets/observability
              readOnly: true
            {{- end }}
          {{- end }}
      {{- if or .Values.postgres.credentialsSecret .Values.providerSecrets.stytch .Values.providerSecrets.calendarEncryption .Values.providerSecrets.familyDataEncryption .Values.providerSecrets.googlePlaces .Values.providerSecrets.resendInvitations .Values.providerSecrets.apns .Values.providerSecrets.observability }}
      volumes:
        {{- if .Values.postgres.credentialsSecret }}
        {{- include "rallyroo.postgresPasswordVolume" . | nindent 8 }}
        {{- end }}
        {{- if .Values.providerSecrets.stytch }}
        - name: stytch-credentials
          secret:
            secretName: {{ .Values.providerSecrets.stytch }}
            defaultMode: 288
            items:
              - key: STYTCH_SECRET
                path: secret
        {{- end }}
        {{- if .Values.providerSecrets.calendarEncryption }}
        - name: calendar-encryption
          secret:
            secretName: {{ .Values.providerSecrets.calendarEncryption }}
            defaultMode: 288
            items:
              - key: CALENDAR_SOURCE_ENCRYPTION_KEY
                path: key
        {{- end }}
        {{- if .Values.providerSecrets.familyDataEncryption }}
        - name: family-data-encryption
          secret:
            secretName: {{ .Values.providerSecrets.familyDataEncryption }}
            defaultMode: 288
            items:
              - key: FAMILY_DATA_ENCRYPTION_KEY
                path: key
        {{- end }}
        {{- if .Values.providerSecrets.googlePlaces }}
        - name: google-places-credentials
          secret:
            secretName: {{ .Values.providerSecrets.googlePlaces }}
            defaultMode: 288
            items:
              - key: GOOGLE_PLACES_API_KEY
                path: api-key
        {{- end }}
        {{- if .Values.providerSecrets.resendInvitations }}
        - name: resend-invitation-credentials
          secret:
            secretName: {{ .Values.providerSecrets.resendInvitations }}
            defaultMode: 288
            items:
              - key: RESEND_API_KEY
                path: api-key
        {{- end }}
        {{- if .Values.providerSecrets.apns }}
        - name: apns-credentials
          secret:
            secretName: {{ .Values.providerSecrets.apns }}
            defaultMode: 288
            items:
              - key: APNS_KEY_ID
                path: key-id
              - key: APNS_PRIVATE_KEY
                path: private-key
        {{- end }}
        {{- if .Values.providerSecrets.observability }}
        - name: observability-credentials
          secret:
            secretName: {{ .Values.providerSecrets.observability }}
            defaultMode: 288
            items:
              - key: METRICS_BEARER_TOKEN
                path: metrics-token
        {{- end }}
      {{- end }}
