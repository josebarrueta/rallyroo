{{- if .Values.runtimeConfig.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-runtime-config
  labels:
    {{- include "rallyroo.labels" . | nindent 4 }}
data:
  LOG_LEVEL: {{ required "runtimeConfig.logLevel is required when runtimeConfig is enabled" .Values.runtimeConfig.logLevel | quote }}
  STYTCH_PROJECT_ID: {{ required "runtimeConfig.stytch.projectID is required when runtimeConfig is enabled" .Values.runtimeConfig.stytch.projectID | quote }}
  STYTCH_PUBLIC_TOKEN: {{ required "runtimeConfig.stytch.publicToken is required when runtimeConfig is enabled" .Values.runtimeConfig.stytch.publicToken | quote }}
  STYTCH_OAUTH_CALLBACK_URL: {{ required "runtimeConfig.stytch.oauthCallbackURL is required when runtimeConfig is enabled" .Values.runtimeConfig.stytch.oauthCallbackURL | quote }}
  STYTCH_ENV: {{ required "runtimeConfig.stytch.environment is required when runtimeConfig is enabled" .Values.runtimeConfig.stytch.environment | quote }}
  STYTCH_CUSTOM_BASE_URL: {{ required "runtimeConfig.stytch.customBaseURL is required when runtimeConfig is enabled" .Values.runtimeConfig.stytch.customBaseURL | quote }}
  INVITATION_EMAIL_FROM: {{ required "runtimeConfig.invitationEmail.from is required when runtimeConfig is enabled" .Values.runtimeConfig.invitationEmail.from | quote }}
  {{- with .Values.runtimeConfig.ollama.baseURL }}
  OLLAMA_BASE_URL: {{ . | quote }}
  OLLAMA_MODEL: {{ required "runtimeConfig.ollama.model is required when Ollama is configured" $.Values.runtimeConfig.ollama.model | quote }}
  {{- end }}
  APNS_TEAM_ID: {{ required "runtimeConfig.apns.teamID is required when runtimeConfig is enabled" .Values.runtimeConfig.apns.teamID | quote }}
  APNS_BUNDLE_ID: {{ required "runtimeConfig.apns.bundleID is required when runtimeConfig is enabled" .Values.runtimeConfig.apns.bundleID | quote }}
  APNS_ENV: {{ required "runtimeConfig.apns.environment is required when runtimeConfig is enabled" .Values.runtimeConfig.apns.environment | quote }}
{{- end }}
